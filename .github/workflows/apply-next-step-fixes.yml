name: Apply Navi next-step fixes

on:
  push:
    branches:
      - upgrade/navi-soul-budget-firewall
    paths:
      - .github/workflows/apply-next-step-fixes.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: upgrade/navi-soul-budget-firewall
          fetch-depth: 0

      - name: Repair contracts and connector regressions
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_exact(path, old, new, expected=1):
              file = Path(path)
              text = file.read_text()
              count = text.count(old)
              if count != expected:
                  raise SystemExit(f"{path}: expected {expected} matches, found {count}: {old!r}")
              file.write_text(text.replace(old, new))
              print(f"patched {path}: {old!r} -> {new!r} ({count}x)")

          # Preserve the original request-budget contract while following the
          # new per-turn budget source of truth instead of stale global caps.
          replace_exact(
              "tests/request-budget.test.mjs",
              "MAX_OUTPUT_TOKENS, ceiling - input",
              "turnBudget.maxOutputTokens, ceiling - input",
          )
          replace_exact(
              "tests/request-budget.test.mjs",
              "attemptOutputTokens < MIN_OUTPUT_TOKENS",
              "attemptOutputTokens < turnBudget.minOutputTokens",
          )
          replace_exact(
              "tests/request-budget.test.mjs",
              "ceiling - fixed - MIN_OUTPUT_TOKENS",
              "ceiling - fixed - turnBudget.minOutputTokens",
          )

          # Tailwind cannot apply /opacity to these var()-backed semantic colours.
          # Move the tinting into CSS where color-mix() is explicit and reliable.
          replace_exact("app/components/connectors-sheet.tsx", "bg-success/10", "connector-soft-success")
          replace_exact("app/components/connectors-sheet.tsx", "bg-elev-2/30", "connector-soft-elev-30")
          replace_exact("app/components/connectors-sheet.tsx", "bg-elev-2/20", "connector-soft-elev-20", expected=2)
          replace_exact("app/components/connectors-sheet.tsx", "bg-danger/10", "connector-soft-danger")

          # Large API discovery must disclose clipping before the API is saved.
          replace_exact(
              "app/components/connectors-sheet.tsx",
              "Keeping the first {discovery.summary.truncated.kept} of {discovery.summary.truncated.declared} declared operations.",
              "This API describes {discovery.summary.truncated.declared} operations; Navi can keep the first {discovery.summary.truncated.kept} here.",
          )

          css_path = Path("app/settings-claude.css")
          css = css_path.read_text()
          marker = '''.connectors-dialog .connector-action {\n  min-height: 32px;\n  padding-inline: 9px;\n  border-radius: 8px;\n  font-size: 13px;\n  line-height: 18px;\n  font-weight: 600;\n}\n'''
          helpers = '''\n/* Semantic connector tints live in CSS because success, danger, and elevation\n   tokens are opaque var() colours in Tailwind. A utility like bg-success/10\n   compiles to no rule at all, while color-mix keeps the intent explicit. */\n.connectors-dialog .connector-soft-success {\n  background: color-mix(in srgb, var(--accent-success) 10%, transparent);\n}\n\n.connectors-dialog .connector-soft-danger {\n  background: color-mix(in srgb, var(--accent-danger) 10%, transparent);\n}\n\n.connectors-dialog .connector-soft-elev-30 {\n  background: color-mix(in srgb, var(--bg-elev-2) 30%, transparent);\n}\n\n.connectors-dialog .connector-soft-elev-20 {\n  background: color-mix(in srgb, var(--bg-elev-2) 20%, transparent);\n}\n'''
          if helpers.strip() not in css:
              count = css.count(marker)
              if count != 1:
                  raise SystemExit(f"app/settings-claude.css: expected one connector-action anchor, found {count}")
              css_path.write_text(css.replace(marker, marker + helpers, 1))
              print("patched app/settings-claude.css: added semantic connector tint helpers")
          else:
              print("app/settings-claude.css: tint helpers already present")
          PY

      - name: Verify patch shape
        run: |
          git diff --check
          grep -F 'turnBudget.maxOutputTokens' tests/request-budget.test.mjs
          grep -F 'turnBudget.minOutputTokens' tests/request-budget.test.mjs
          grep -F 'This API describes {discovery.summary.truncated.declared} operations' app/components/connectors-sheet.tsx
          ! grep -E 'bg-(success|danger|elev-2)/' app/components/connectors-sheet.tsx

      - name: Commit source fixes and remove helper workflow
        run: |
          git rm .github/workflows/apply-next-step-fixes.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/request-budget.test.mjs app/components/connectors-sheet.tsx app/settings-claude.css
          git diff --cached --check
          git commit -m "Repair budget contracts and connector regressions"
          git push origin HEAD:upgrade/navi-soul-budget-firewall
