<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#0B0D12" />
  <title>Navi · Offline</title>
  <style>
    :root { color-scheme: dark; font-family: ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"SF Pro Text",sans-serif; background:#0B0D12; color:#F5F7FB; }
    * { box-sizing:border-box; }
    html,body { width:100%; height:100%; margin:0; overflow:hidden; background:#0B0D12; }
    body { display:grid; place-items:center; padding:max(env(safe-area-inset-top),24px) 24px max(env(safe-area-inset-bottom),24px); }
    main { max-width:360px; text-align:center; }
    .mark { display:grid; place-items:center; width:58px; height:58px; margin:0 auto 20px; border:1px solid #262D3E; border-radius:20px; background:#161A24; font-size:28px; font-weight:700; letter-spacing:-4px; padding-right:4px; }
    h1 { margin:0; font-size:24px; line-height:30px; }
    p { margin:12px 0 0; color:#8F9AB5; font-size:14px; line-height:21px; }
  </style>
</head>
<body>
  <main>
    <div class="mark">N</div>
    <h1>Navi is offline</h1>
    <p>Reopen the app shell to view your most recent local thread. Sending stays disabled until the connection returns.</p>
  </main>
</body>
</html>
