<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <meta name="theme-color" content="#0d0d0d" />
    <title>Navi · Offline</title>
    <style>
      :root {
        color-scheme: dark;
        background: #0d0d0d;
        font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif;
      }
      * { box-sizing: border-box; }
      html, body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        background: #0d0d0d;
        color: #fff;
      }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        padding: max(env(safe-area-inset-top), 24px) 24px max(env(safe-area-inset-bottom), 24px);
      }
      main { width: 100%; max-width: 360px; text-align: center; }
      .icon {
        display: flex;
        width: 58px;
        height: 58px;
        margin: 0 auto 22px;
        align-items: center;
        justify-content: center;
        border: 1px solid #303030;
        border-radius: 18px;
        background: #171717;
        font-size: 28px;
        font-weight: 700;
        letter-spacing: -3px;
        padding-right: 3px;
      }
      h1 { margin: 0; font-size: 25px; letter-spacing: -0.03em; }
      p { margin: 12px auto 24px; color: #a3a3a3; font-size: 15px; line-height: 1.5; }
      button {
        min-width: 140px;
        min-height: 46px;
        border: 0;
        border-radius: 999px;
        background: #fff;
        color: #000;
        font: inherit;
        font-size: 15px;
        font-weight: 600;
      }
    </style>
  </head>
  <body>
    <main>
      <div class="icon">N</div>
      <h1>Navi is offline</h1>
      <p>The app shell is available, but AI responses require an internet connection.</p>
      <button type="button" onclick="window.location.reload()">Try again</button>
    </main>
  </body>
</html>
