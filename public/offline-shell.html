<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <meta name="theme-color" content="#191614" />
    <title>Navi is offline</title>
    <style>
      :root { color-scheme: dark; font-family: ui-sans-serif, system-ui, sans-serif; background: #191614; color: #f7f0e8; }
      * { box-sizing: border-box; }
      body { min-height: 100dvh; margin: 0; display: grid; place-items: center; padding: 24px; background: radial-gradient(circle at 50% 28%, #2b211c 0, #191614 46%); }
      main { width: min(100%, 390px); text-align: center; }
      img { width: 82px; height: 82px; border-radius: 24px; box-shadow: 0 18px 48px #0008; }
      h1 { margin: 24px 0 8px; font: 500 30px/1.15 ui-serif, Georgia, serif; letter-spacing: -.03em; }
      p { margin: 0 auto; max-width: 320px; color: #bdb2a7; font-size: 14px; line-height: 1.55; }
      a { display: inline-flex; min-height: 48px; align-items: center; justify-content: center; margin-top: 24px; padding: 0 20px; border-radius: 999px; background: #c76740; color: white; font-size: 14px; font-weight: 650; text-decoration: none; }
    </style>
  </head>
  <body>
    <main>
      <img src="/pwa-icon-192-v4.png" alt="Navi" />
      <h1>You’re offline</h1>
      <p>Your local workspace stays on this device. Reconnect to verify your account and continue.</p>
      <a href="/new">Try again</a>
    </main>
  </body>
</html>
